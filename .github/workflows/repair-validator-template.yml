name: Repair validator template source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-validator-template.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace validator template with non-interpolated source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'src/agent-template.ts';
          let s = fs.readFileSync(p, 'utf8');
          const start = s.indexOf('export const AGENT_VALIDATOR =');
          const end = s.indexOf('export const AGENT_VALIDATOR_JS =');
          if (start < 0 || end < 0 || end <= start) throw new Error('validator markers not found');
          const replacement = [
            'export const AGENT_VALIDATOR = [',
            "  '#!/usr/bin/env bash',",
            "  'set -euo pipefail',",
            "  'ROOT=\"${1:-.}\"',",
            "  'MODE=\"${2:-standard}\"',",
            "  'cd \"$ROOT\"',",
            "  'node .vela/validator.mjs \"$MODE\"',",
            "  '',",
            "].join('\\n');",
            '',
          ].join('\n');
          s = s.slice(0, start) + replacement + s.slice(end);
          fs.writeFileSync(p, s);
          NODE
          git config user.name 'Vela Repair Bot'
          git config user.email 'vela-repair@users.noreply.github.com'
          git add src/agent-template.ts
          git rm .github/workflows/repair-validator-template.yml
          git commit -m 'fix: use non-interpolated validator shell template'
          git push origin HEAD:main
