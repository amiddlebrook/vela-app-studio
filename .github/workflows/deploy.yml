name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: vela-control-plane-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ensure runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.126.0"
          SECRET_NAMES="$($WRANGLER secret list --format json | jq -r '.[].name')"
          PAYLOAD='{}'

          if ! grep -Fxq 'SESSION_SECRET' <<<"$SECRET_NAMES"; then
            VALUE="$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')"
            PAYLOAD="$(jq -c --arg value "$VALUE" '. + {SESSION_SECRET:$value}' <<<"$PAYLOAD")"
            echo 'SESSION_SECRET missing; creating it.'
          else
            echo 'SESSION_SECRET already configured.'
          fi

          if ! grep -Fxq 'TOKEN_ENCRYPTION_KEY' <<<"$SECRET_NAMES"; then
            VALUE="$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')"
            PAYLOAD="$(jq -c --arg value "$VALUE" '. + {TOKEN_ENCRYPTION_KEY:$value}' <<<"$PAYLOAD")"
            echo 'TOKEN_ENCRYPTION_KEY missing; creating it.'
          else
            echo 'TOKEN_ENCRYPTION_KEY already configured.'
          fi

          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            PAYLOAD="$(jq -c --arg value "$CLOUDFLARE_API_TOKEN" '. + {CLOUDFLARE_API_TOKEN:$value}' <<<"$PAYLOAD")"
            echo 'Synchronizing CLOUDFLARE_API_TOKEN into Worker runtime secrets.'
          else
            echo 'CLOUDFLARE_API_TOKEN GitHub Actions secret is missing.' >&2
            exit 1
          fi

          if grep -Fxq 'OPENROUTER_API_KEY' <<<"$SECRET_NAMES"; then
            echo 'OPENROUTER_API_KEY already configured on Worker.'
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
            PAYLOAD="$(jq -c --arg value "$OPENROUTER_API_KEY" '. + {OPENROUTER_API_KEY:$value}' <<<"$PAYLOAD")"
            echo 'Installing OPENROUTER_API_KEY from GitHub Actions secret.'
          else
            echo 'OPENROUTER_API_KEY is not configured; Workers AI remains available as the native mesh fallback.'
          fi

          if [ "$PAYLOAD" != '{}' ]; then
            printf '%s' "$PAYLOAD" > /tmp/vela-runtime-secrets.json
            $WRANGLER secret bulk /tmp/vela-runtime-secrets.json
            rm -f /tmp/vela-runtime-secrets.json
          fi

          echo 'Configured Worker secret names:'
          $WRANGLER secret list --format json | jq -r '.[].name' | sort

      - name: Reconcile D1 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.126.0"
          DB="vela-control-plane"

          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0001_control_plane.sql
          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL);"

          column_exists() {
            local table="$1"
            local column="$2"
            $WRANGLER d1 execute "$DB" --remote --json --command "SELECT COUNT(*) AS present FROM pragma_table_info('$table') WHERE name='$column';" \
              | grep -Eq '"present"[[:space:]]*:[[:space:]]*1'
          }

          ensure_column() {
            local table="$1"
            local column="$2"
            local definition="$3"
            if column_exists "$table" "$column"; then
              echo "$table.$column already exists"
            else
              echo "Adding $table.$column"
              $WRANGLER d1 execute "$DB" --remote --yes --command "ALTER TABLE $table ADD COLUMN $column $definition;"
            fi
          }

          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS oauth_states (state_hash TEXT PRIMARY KEY, provider TEXT NOT NULL, session_id TEXT NOT NULL, code_verifier_ciphertext TEXT NOT NULL, redirect_uri TEXT NOT NULL, expires_at TEXT NOT NULL, created_at TEXT NOT NULL); CREATE INDEX IF NOT EXISTS idx_oauth_states_expires_at ON oauth_states(expires_at);"
          ensure_column connections access_token_ciphertext "TEXT"
          ensure_column connections refresh_token_ciphertext "TEXT"
          ensure_column connections token_expires_at "TEXT"

          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS build_events (id TEXT PRIMARY KEY, project_id TEXT NOT NULL, kind TEXT NOT NULL, detail TEXT NOT NULL, stage TEXT, created_at TEXT NOT NULL); CREATE INDEX IF NOT EXISTS idx_build_events_project_created ON build_events(project_id, created_at DESC);"
          ensure_column build_events stage "TEXT"

          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS users (id TEXT PRIMARY KEY, google_subject TEXT NOT NULL UNIQUE, email TEXT, name TEXT, created_at TEXT NOT NULL, updated_at TEXT NOT NULL);"
          ensure_column projects scaffolding_json "TEXT"
          ensure_column projects plan_json "TEXT"

          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0008_enterprise_schema.sql
          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0009_workspace_settings.sql
          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0010_agentic_builder.sql
          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0011_universal_mesh.sql

          $WRANGLER d1 execute "$DB" --remote --yes --command "INSERT OR IGNORE INTO d1_migrations(name) VALUES ('0001_control_plane.sql'), ('0002_oauth_connections.sql'), ('0003_build_events.sql'), ('0004_users.sql'), ('0005_scaffolding.sql'), ('0006_build_events_stage.sql'), ('0007_plan_json.sql'), ('0008_enterprise_schema.sql'), ('0009_workspace_settings.sql'), ('0010_agentic_builder.sql'), ('0011_universal_mesh.sql');"

      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.126.0 deploy

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://vela-control-plane.averymiddlebrook2014.workers.dev'

          check_status() {
            local label="$1" url="$2" output="$3"
            local status
            status="$(curl --fail-with-body --retry 3 --retry-delay 2 -sS -o "$output" -w '%{http_code}' "$url")" || {
              echo "::error title=$label HTTP failure::Could not fetch $url"
              head -c 1200 "$output" || true
              exit 1
            }
            echo "$label: HTTP $status ($(wc -c < "$output") bytes)"
            if [[ "$status" != 2* ]]; then
              echo "::error title=$label status::Unexpected HTTP $status"
              head -c 1200 "$output"
              exit 1
            fi
          }

          check_status health "$BASE/health" /tmp/vela-health.json
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/vela-health.json','utf8'));if(x.ok!==true)throw Error('health ok != true')"

          check_status home "$BASE/" /tmp/vela-root.html
          node --input-type=module -e "import{readFileSync}from'node:fs';const h=readFileSync('/tmp/vela-root.html','utf8');for(const x of ['<html','metric-ready','/ai'])if(!h.includes(x))throw Error('home missing '+x)"
          check_status ai "$BASE/ai" /tmp/vela-ai.html
          node --input-type=module -e "import{readFileSync}from'node:fs';const h=readFileSync('/tmp/vela-ai.html','utf8');if(!h.includes('<html'))throw Error('AI page is not HTML')"

          session_status="$(curl -sS -c /tmp/vela.cookies -o /tmp/vela-session.json -w '%{http_code}' -X POST "$BASE/session")"
          echo "session: HTTP $session_status"
          if [[ "$session_status" != 2* ]]; then
            head -c 1200 /tmp/vela-session.json
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('/tmp/vela-session.json','utf8'))"

          for endpoint in connections mesh/state; do
            name="${endpoint//\//-}"
            status="$(curl -sS -b /tmp/vela.cookies -o "/tmp/vela-$name.json" -w '%{http_code}' "$BASE/$endpoint")"
            echo "$endpoint: HTTP $status"
            if [[ "$status" != 2* ]]; then
              head -c 1200 "/tmp/vela-$name.json"
              exit 1
            fi
            node -e "const x=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(process.argv[2]==='connections'&&!Array.isArray(x.connections))throw Error('invalid connections');if(process.argv[2]==='mesh/state'&&(!Array.isArray(x.catalog)||!Array.isArray(x.links)||!Array.isArray(x.runs)))throw Error('invalid mesh state')" "/tmp/vela-$name.json" "$endpoint"
          done
          echo 'Production read-only smoke tests passed.'
