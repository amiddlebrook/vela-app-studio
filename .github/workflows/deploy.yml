name: Deploy to Cloudflare

on:
  push:
    branches: [main]

concurrency:
  group: vela-control-plane-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Ensure runtime secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.126.0"
          SECRET_NAMES="$($WRANGLER secret list --format json | jq -r '.[].name')"
          PAYLOAD='{}'

          if ! grep -Fxq 'SESSION_SECRET' <<<"$SECRET_NAMES"; then
            VALUE="$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')"
            PAYLOAD="$(jq -c --arg value "$VALUE" '. + {SESSION_SECRET:$value}' <<<"$PAYLOAD")"
            echo 'SESSION_SECRET missing; creating it.'
          else
            echo 'SESSION_SECRET already configured.'
          fi

          if ! grep -Fxq 'TOKEN_ENCRYPTION_KEY' <<<"$SECRET_NAMES"; then
            VALUE="$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')"
            PAYLOAD="$(jq -c --arg value "$VALUE" '. + {TOKEN_ENCRYPTION_KEY:$value}' <<<"$PAYLOAD")"
            echo 'TOKEN_ENCRYPTION_KEY missing; creating it.'
          else
            echo 'TOKEN_ENCRYPTION_KEY already configured.'
          fi

          # Cloudflare OAuth is retained for user/account identity, but several
          # Worker-management endpoints do not accept OAuth access tokens. The
          # API token already used by this deployment is therefore synchronized
          # into the Worker runtime for generated-app provisioning operations.
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            PAYLOAD="$(jq -c --arg value "$CLOUDFLARE_API_TOKEN" '. + {CLOUDFLARE_API_TOKEN:$value}' <<<"$PAYLOAD")"
            echo 'Synchronizing CLOUDFLARE_API_TOKEN into Worker runtime secrets.'
          else
            echo 'CLOUDFLARE_API_TOKEN GitHub Actions secret is missing.' >&2
            exit 1
          fi

          if grep -Fxq 'OPENROUTER_API_KEY' <<<"$SECRET_NAMES"; then
            echo 'OPENROUTER_API_KEY already configured on Worker.'
          elif [ -n "${OPENROUTER_API_KEY:-}" ]; then
            PAYLOAD="$(jq -c --arg value "$OPENROUTER_API_KEY" '. + {OPENROUTER_API_KEY:$value}' <<<"$PAYLOAD")"
            echo 'Installing OPENROUTER_API_KEY from GitHub Actions secret.'
          else
            echo 'OPENROUTER_API_KEY is not configured; Cloudflare Workers AI will be used as the automatic fallback/primary provider.'
          fi

          if [ "$PAYLOAD" != '{}' ]; then
            printf '%s' "$PAYLOAD" > /tmp/vela-runtime-secrets.json
            $WRANGLER secret bulk /tmp/vela-runtime-secrets.json
            rm -f /tmp/vela-runtime-secrets.json
          fi

          echo 'Configured Worker secret names:'
          $WRANGLER secret list --format json | jq -r '.[].name' | sort

      - name: Reconcile D1 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WRANGLER="npx --yes wrangler@4.126.0"
          DB="vela-control-plane"

          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0001_control_plane.sql
          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL);"

          column_exists() {
            local table="$1"
            local column="$2"
            $WRANGLER d1 execute "$DB" --remote --json --command "SELECT COUNT(*) AS present FROM pragma_table_info('$table') WHERE name='$column';" \
              | grep -Eq '"present"[[:space:]]*:[[:space:]]*1'
          }

          ensure_column() {
            local table="$1"
            local column="$2"
            local definition="$3"
            if column_exists "$table" "$column"; then
              echo "$table.$column already exists"
            else
              echo "Adding $table.$column"
              $WRANGLER d1 execute "$DB" --remote --yes --command "ALTER TABLE $table ADD COLUMN $column $definition;"
            fi
          }

          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS oauth_states (state_hash TEXT PRIMARY KEY, provider TEXT NOT NULL, session_id TEXT NOT NULL, code_verifier_ciphertext TEXT NOT NULL, redirect_uri TEXT NOT NULL, expires_at TEXT NOT NULL, created_at TEXT NOT NULL); CREATE INDEX IF NOT EXISTS idx_oauth_states_expires_at ON oauth_states(expires_at);"
          ensure_column connections access_token_ciphertext "TEXT"
          ensure_column connections refresh_token_ciphertext "TEXT"
          ensure_column connections token_expires_at "TEXT"

          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS build_events (id TEXT PRIMARY KEY, project_id TEXT NOT NULL, kind TEXT NOT NULL, detail TEXT NOT NULL, stage TEXT, created_at TEXT NOT NULL); CREATE INDEX IF NOT EXISTS idx_build_events_project_created ON build_events(project_id, created_at DESC);"
          ensure_column build_events stage "TEXT"

          $WRANGLER d1 execute "$DB" --remote --yes --command "CREATE TABLE IF NOT EXISTS users (id TEXT PRIMARY KEY, google_subject TEXT NOT NULL UNIQUE, email TEXT, name TEXT, created_at TEXT NOT NULL, updated_at TEXT NOT NULL);"
          ensure_column projects scaffolding_json "TEXT"
          ensure_column projects plan_json "TEXT"

          # Idempotent migration files that were previously only marked as applied.
          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0008_enterprise_schema.sql
          $WRANGLER d1 execute "$DB" --remote --yes --file=migrations/0009_workspace_settings.sql

          $WRANGLER d1 execute "$DB" --remote --yes --command "INSERT OR IGNORE INTO d1_migrations(name) VALUES ('0001_control_plane.sql'), ('0002_oauth_connections.sql'), ('0003_build_events.sql'), ('0004_users.sql'), ('0005_scaffolding.sql'), ('0006_build_events_stage.sql'), ('0007_plan_json.sql'), ('0008_enterprise_schema.sql'), ('0009_workspace_settings.sql');"

      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.126.0 deploy

      - name: Repair generated workers.dev routes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          scripts="$(curl -fsS "$API/scripts" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq -r '.result[]?.id | select(startswith("vela-") and . != "vela-control-plane")')"
          if [ -z "$scripts" ]; then
            echo 'No generated Vela Workers require workers.dev route reconciliation.'
          else
            while IFS= read -r script; do
              [ -n "$script" ] || continue
              echo "Ensuring workers.dev route is enabled for $script"
              curl -fsS -X POST "$API/scripts/$script/subdomain" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H 'content-type: application/json' \
                --data '{"enabled":true,"previews_enabled":true}' >/dev/null
            done <<<"$scripts"
          fi

      - name: Runtime smoke test
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE='https://vela-control-plane.averymiddlebrook2014.workers.dev'

          request() {
            local label="$1"
            local output="$2"
            shift 2
            local status
            status="$(curl -sS -o "$output" -w '%{http_code}' "$@")"
            if [[ "$status" != 2* ]]; then
              echo "$label failed with HTTP $status"
              cat "$output"
              exit 1
            fi
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$output"
          }

          for attempt in {1..10}; do
            status="$(curl -sS -o /tmp/vela-health.json -w '%{http_code}' "$BASE/health" || true)"
            if [ "$status" = '200' ]; then
              break
            fi
            sleep 2
          done
          if [ "${status:-}" != '200' ]; then
            echo "health check failed with HTTP ${status:-none}"
            cat /tmp/vela-health.json 2>/dev/null || true
            exit 1
          fi
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/vela-health.json','utf8'));if(x.ok!==true)process.exit(1)"

          request session /tmp/vela-session.json -c /tmp/vela.cookies -X POST "$BASE/session"
          request connections /tmp/vela-connections.json -b /tmp/vela.cookies "$BASE/connections"
          request projects /tmp/vela-projects.json -b /tmp/vela.cookies "$BASE/projects"
          request create-project /tmp/vela-create.json -b /tmp/vela.cookies -X POST -H 'content-type: application/json' -d '{"name":"CI Smoke Test","prompt":"Build a minimal calculator smoke-test app"}' "$BASE/projects"

          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/vela-connections.json','utf8'));if(!Array.isArray(x.connections))throw new Error('connections payload invalid')"
          node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/vela-projects.json','utf8'));if(!Array.isArray(x.projects))throw new Error('projects payload invalid')"
          SMOKE_ID="$(node -e "const x=JSON.parse(require('fs').readFileSync('/tmp/vela-create.json','utf8'));const id=x.project?.id;if(!/^[0-9a-f-]{36}$/.test(id||''))throw new Error('created project payload invalid');process.stdout.write(id)")"

          npx --yes wrangler@4.126.0 d1 execute vela-control-plane --remote --yes --command "DELETE FROM build_events WHERE project_id = '$SMOKE_ID'; DELETE FROM project_features WHERE project_id = '$SMOKE_ID'; DELETE FROM usage_events WHERE project_id = '$SMOKE_ID'; DELETE FROM projects WHERE id = '$SMOKE_ID';"
          echo 'Runtime smoke test passed, including project creation.'
