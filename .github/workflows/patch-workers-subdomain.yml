name: Patch workers.dev endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact Cloudflare subdomain method
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          endpoint = '/workers/scripts/${encodeURIComponent(workerName)}/subdomain`,'
          pos = s.find(endpoint)
          if pos < 0:
              raise SystemExit('Target subdomain endpoint not found')
          start = pos
          end = s.find('body: JSON.stringify({ enabled: true, previews_enabled: true })', pos)
          if end < 0:
              raise SystemExit('Target subdomain request body not found')
          block = s[start:end]
          old = "method: 'PUT'"
          new = "method: 'POST'"
          if new in block and old not in block:
              print('Already patched')
              raise SystemExit(0)
          if block.count(old) != 1:
              raise SystemExit(f'Expected exactly one PUT in target block, found {block.count(old)}')
          block = block.replace(old, new, 1)
          p.write_text(s[:start] + block + s[end:])
          print('Patched per-script workers.dev method PUT -> POST')
          PY
          if git diff --quiet -- src/index.ts; then
            echo 'No patch required.'
            exit 0
          fi
          git diff --check
          git diff -- src/index.ts
          git config user.name 'vela-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.ts
          git commit -m 'Fix workers.dev subdomain enable method'
          git push origin HEAD:main
