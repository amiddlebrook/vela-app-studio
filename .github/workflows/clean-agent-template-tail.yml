name: Clean agent template tail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-agent-template-tail.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep one complete validator implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/agent-template.ts')
          s=p.read_text()
          marker='export const AGENT_VALIDATOR_JS = String.raw`'
          start=s.index(marker)
          end=s.index('\n`;', start)+len('\n`;')
          p.write_text(s[:end]+'\n')
          PY
          git config user.name 'Vela Repair Bot'
          git config user.email 'vela-repair@users.noreply.github.com'
          git add src/agent-template.ts
          git rm .github/workflows/clean-agent-template-tail.yml
          git commit -m 'fix: remove duplicate corrupted validator template tail'
          git push origin HEAD:main
