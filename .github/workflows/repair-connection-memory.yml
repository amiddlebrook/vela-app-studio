name: Repair connection memory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch persistent connection identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('src/index.ts')
          s = p.read_text()

          # 1) Recover a stale anonymous session after SESSION_SECRET rotation.
          anchor = """async function encrypt(value: unknown, key: CryptoKey): Promise<string> {"""
          insert = """function unsignedAnonymousSessionId(request: Request): string | null {
            const value = request.headers.get('cookie')?.match(new RegExp(`(?:^|;\\\\s*)${SESSION_COOKIE}=([^;]+)`))?.[1];
            const id = value?.split('.')[0] ?? null;
            return id && /^[A-Za-z0-9_-]{40,64}$/.test(id) ? id : null;
          }

          async function ownerHasState(env: Env, ownerId: string): Promise<boolean> {
            const row = await env.DB.prepare('SELECT 1 AS present FROM connections WHERE owner_id = ? UNION ALL SELECT 1 AS present FROM projects WHERE owner_id = ? LIMIT 1')
              .bind(ownerId, ownerId)
              .first<{ present: number }>();
            return row?.present === 1;
          }

          """
          if 'function unsignedAnonymousSessionId' not in s:
              if anchor not in s:
                  raise SystemExit('session helper insertion anchor not found')
              s = s.replace(anchor, insert + anchor, 1)

          old_session = """    if (url.pathname === '/session' && request.method === 'POST') {
                const existing = await readSession(request, env.SESSION_SECRET);
                if (existing) return json({ ready: true });
                const session = await issueSession(env.SESSION_SECRET);
                return json({ ready: true }, { headers: { 'set-cookie': session.cookie } });
              }"""
          new_session = """    if (url.pathname === '/session' && request.method === 'POST') {
                const existing = await readSession(request, env.SESSION_SECRET);
                if (existing) return json({ ready: true });
                const staleOwnerId = unsignedAnonymousSessionId(request);
                if (staleOwnerId && await ownerHasState(env, staleOwnerId)) {
                  const recovered = await issueSessionForId(staleOwnerId, env.SESSION_SECRET);
                  return json({ ready: true, recovered: true }, { headers: { 'set-cookie': recovered.cookie } });
                }
                const session = await issueSession(env.SESSION_SECRET);
                return json({ ready: true }, { headers: { 'set-cookie': session.cookie } });
              }"""
          if 'const staleOwnerId = unsignedAnonymousSessionId(request);' not in s:
              if old_session not in s:
                  raise SystemExit('session endpoint block not found')
              s = s.replace(old_session, new_session, 1)

          # 2) Recover a prior workspace by the provider's stable external account id.
          owner_anchor = """async function completeGoogleLogin(env: Env, anonymousOwnerId: string, identity: ProviderIdentity): Promise<{ ownerId: string; cookie: string }> {"""
          owner_helpers = """async function mergeOwnerState(env: Env, currentOwnerId: string, targetOwnerId: string): Promise<void> {
            if (currentOwnerId === targetOwnerId) return;
            const now = new Date().toISOString();
            const currentConnections = await env.DB.prepare('SELECT id, provider FROM connections WHERE owner_id = ?')
              .bind(currentOwnerId)
              .all<{ id: string; provider: string }>();
            for (const connection of currentConnections.results) {
              const target = await env.DB.prepare('SELECT id FROM connections WHERE owner_id = ? AND provider = ?')
                .bind(targetOwnerId, connection.provider)
                .first<{ id: string }>();
              if (target) {
                await env.DB.prepare('DELETE FROM connections WHERE id = ?').bind(connection.id).run();
              } else {
                await env.DB.prepare('UPDATE connections SET owner_id = ?, updated_at = ? WHERE id = ?')
                  .bind(targetOwnerId, now, connection.id)
                  .run();
              }
            }
            await env.DB.prepare('UPDATE projects SET owner_id = ?, updated_at = ? WHERE owner_id = ?')
              .bind(targetOwnerId, now, currentOwnerId)
              .run();
          }

          async function recoverOwnerFromProvider(env: Env, currentOwnerId: string, provider: Exclude<Provider, 'google'>, externalAccountId: string): Promise<string> {
            const existing = await env.DB.prepare('SELECT owner_id FROM connections WHERE provider = ? AND external_account_id = ? ORDER BY updated_at DESC LIMIT 1')
              .bind(provider, externalAccountId)
              .first<{ owner_id: string }>();
            if (!existing?.owner_id || existing.owner_id === currentOwnerId) return currentOwnerId;
            await mergeOwnerState(env, currentOwnerId, existing.owner_id);
            return existing.owner_id;
          }

          async function refreshCloudflareConnectionIfNeeded(env: Env, ownerId: string): Promise<void> {
            const connection = await env.DB.prepare('SELECT refresh_token_ciphertext, token_expires_at FROM connections WHERE owner_id = ? AND provider = ? AND status = ?')
              .bind(ownerId, 'cloudflare', 'connected')
              .first<{ refresh_token_ciphertext: string | null; token_expires_at: string | null }>();
            if (!connection?.refresh_token_ciphertext || !connection.token_expires_at) return;
            if (Date.parse(connection.token_expires_at) > Date.now() + 60_000) return;
            try {
              await connectedToken(env, ownerId, 'cloudflare');
            } catch (error) {
              console.warn('Cloudflare token refresh during connection check failed:', messageFromError(error));
            }
          }

          """
          if 'async function recoverOwnerFromProvider' not in s:
              if owner_anchor not in s:
                  raise SystemExit('owner recovery insertion anchor not found')
              s = s.replace(owner_anchor, owner_helpers + owner_anchor, 1)

          old_callback = """        const login = callbackProvider === 'google' ? await completeGoogleLogin(env, stored.session_id, identity) : null;
                const ownerId = login?.ownerId ?? stored.session_id;
                const now = new Date().toISOString();"""
          new_callback = """        const login = callbackProvider === 'google' ? await completeGoogleLogin(env, stored.session_id, identity) : null;
                let ownerId = login?.ownerId ?? stored.session_id;
                let sessionCookie = login?.cookie;
                if (!login && (callbackProvider === 'github' || callbackProvider === 'cloudflare')) {
                  const recoveredOwnerId = await recoverOwnerFromProvider(env, stored.session_id, callbackProvider, identity.id);
                  if (recoveredOwnerId !== stored.session_id) {
                    ownerId = recoveredOwnerId;
                    sessionCookie = (await issueSessionForId(ownerId, env.SESSION_SECRET)).cookie;
                  }
                }
                const now = new Date().toISOString();"""
          if 'let sessionCookie = login?.cookie;' not in s:
              if old_callback not in s:
                  raise SystemExit('oauth callback owner block not found')
              s = s.replace(old_callback, new_callback, 1)

          old_return = """        return successPage(callbackProvider, login?.cookie);"""
          new_return = """        return successPage(callbackProvider, sessionCookie);"""
          if new_return not in s:
              if old_return not in s:
                  raise SystemExit('oauth callback success return not found')
              s = s.replace(old_return, new_return, 1)

          # 3) Refresh Cloudflare before classifying a remembered connection as disconnected.
          providers_anchor = """async function connectionProviders(env: Env, ownerId: string): Promise<Set<string>> {
            const result = await env.DB.prepare"""
          providers_replacement = """async function connectionProviders(env: Env, ownerId: string): Promise<Set<string>> {
            await refreshCloudflareConnectionIfNeeded(env, ownerId);
            const result = await env.DB.prepare"""
          if 'async function connectionProviders' in s and 'await refreshCloudflareConnectionIfNeeded(env, ownerId);\n  const result' not in s:
              if providers_anchor not in s:
                  raise SystemExit('connectionProviders anchor not found')
              s = s.replace(providers_anchor, providers_replacement, 1)

          connections_anchor = """    if (url.pathname === '/connections' && request.method === 'GET') {
                if (!sessionId) return json({ error: 'Connect an account first.' }, { status: 401 });
                const connections = await env.DB.prepare"""
          connections_replacement = """    if (url.pathname === '/connections' && request.method === 'GET') {
                if (!sessionId) return json({ error: 'Connect an account first.' }, { status: 401 });
                await refreshCloudflareConnectionIfNeeded(env, sessionId);
                const connections = await env.DB.prepare"""
          if "await refreshCloudflareConnectionIfNeeded(env, sessionId);" not in s:
              if connections_anchor not in s:
                  raise SystemExit('/connections anchor not found')
              s = s.replace(connections_anchor, connections_replacement, 1)

          p.write_text(s)
          PY

          git diff --check
          git diff -- src/index.ts

          python - <<'PY'
          import subprocess
          diff = subprocess.check_output(['git','diff','--','src/index.ts'], text=True)
          required = [
              'unsignedAnonymousSessionId',
              'ownerHasState',
              'recoverOwnerFromProvider',
              'mergeOwnerState',
              'refreshCloudflareConnectionIfNeeded',
              'sessionCookie',
          ]
          missing = [x for x in required if x not in diff]
          if missing:
              raise SystemExit('Expected repair pieces missing from diff: ' + ', '.join(missing))
          print('Connection-memory repair diff validated.')
          PY

          git config user.name 'vela-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/index.ts
          git commit -m 'Persist and recover connected account state'
          git push origin HEAD:main
