name: Fix JWT template literal escaping

on:
  push:
    paths:
      - '.github/workflows/fix-jwt-template.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix nested template literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          replacements = {
              'new TextEncoder().encode(`${header}.${body}`)': 'new TextEncoder().encode(`\\${header}.\\${body}`)',
              'return `${header}.${body}.${sigB64}`;': 'return `\\${header}.\\${body}.\\${sigB64}`;',
          }
          changed = False
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
                  changed = True
          if not changed:
              raise SystemExit('Expected JWT template-literal text was not found; refusing to make a blind change.')
          p.write_text(s)
          PY

      - name: Commit and push fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: escape nested JWT template literals'
          git push
